name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pata-ai/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'pata-ai/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pata-ai/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-asyncio

      - name: Lint with flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning exit-zero for style guidelines
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Execute Pytest Suite
        run: |
          pytest app/tests/ -v --tb=short
